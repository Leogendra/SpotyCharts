<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="styles/home.css">
    <link rel="stylesheet" href="styles/slider.css">
    <link rel="stylesheet" href="styles/cards.css">
    <link rel="stylesheet" href="styles/scores.css">
    <title>SpotyCharts</title>
</head>

<body>
    <div class="home">
        <div class="big-title">SpotyCharts</div>
        <div class="choose-mode"><span data-translations="lastUpdate">Last update of artists:</span> <span
                class="maj-date underline"></span></div>

        <div class="langue">
            <label class="switch">
                <input type="checkbox" class="slide">
                <span class="slider round"></span>
            </label>
        </div>

        <section class="dataset">
            <div>
                <input type="radio" id="dataset_en" name="dataset" value="en" checked>
                <label for="dataset_en" class="label_modes">
                    <h2 class="mode" data-translations="topWorld">World artists</h2>
                </label>
            </div>
            <div>
                <input type="radio" id="dataset_fr" name="dataset" value="fr">
                <label for="dataset_fr" class="label_modes">
                    <h2 class="mode" data-translations="topFrance">French artists</h2>
                </label>
            </div>
        </section>

        <button class="animated-button">
            <div class="rotating-image">
                <img src="assets/banniere_black.png" alt="SpotyCharts">
            </div>
            <div class="inner-button" data-translations="play">
                Play
            </div>
        </button>
    </div>

    <div class="game">

        <div class="card-container">
            <div class="card choice" data-vote="1">
                <img class="card-img" src="">
                <img class="card-img-wide" src="">
                <div class="card-info">
                    <h2 class="card-artist"></h2>
                    <h2 class="card-song italique"></h2>
                    <p class="card-followers"></p>
                    <input type="hidden" class="card-uri">
                </div>
            </div>

            <div class="div-scores">
                <div class="help" data-translations-html="helpMonthly"></div>
                <div class="score">
                    <span class="nb-score">0</span>🔥
                </div>
                <div class="best">
                    <span data-translations="record">Record:</span> <span class="nb-best">0</span>
                </div>
            </div>

            <div class="card choice" data-vote="2">
                <img class="card-img" src="">
                <img class="card-img-wide" src="">
                <div class="card-info">
                    <h2 class="card-artist"></h2>
                    <h2 class="card-song italique"></h2>
                    <p class="card-followers"></p>
                    <input type="hidden" class="card-uri">
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/utils.js"></script>
    <script src="scripts/parseur.js"></script>
    <script src="scripts/translations.js"></script>
    <script src="scripts/app.js"></script>
</body>

</html>
